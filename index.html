<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#95BD39">
<title>羽迹 · 观鸟交流平台</title>
<!-- 👇 引入 Remix Icon 图标库（极其重要！不引入图标全看不见） -->
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime">08:33</span>
    <span class="sb-right"></span>
  </div>

  <!-- 顶部主功能 Tab -->
  <div class="top-tabs-wrapper" style="display: flex; align-items: center; background: #95BD39; padding-right: 15px;">
    <div class="top-tabs" style="flex:1; background: transparent;">
      <div class="tab" data-tab="comm">交流</div>
      <div class="tab" data-tab="map">地图</div>
      <div class="tab" data-tab="ai">AI识别</div>
      <div class="tab" data-tab="progress">进度</div>
    </div>
    <!-- 搜索图标按钮 -->
    <span class="icon-search" id="topSearchBtn" style="color: white; font-size: 20px; cursor: pointer; margin-left: 8px;"><i class="ri-search-line"></i></span>
  </div>
  
  <!-- 主内容区 -->
  <main class="main" id="main">
    <section class="page" id="page-comm"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-ai"></section>
    <section class="page" id="page-progress"></section>
    
    <!-- 独立子页面 -->
    <section class="page" id="page-my-birds"></section>
    <section class="page" id="page-my-badges"></section>
    <section class="page" id="page-offline"></section>
    <section class="page" id="page-edit-profile"></section>
    <section class="page" id="page-user-profile"></section>
    <section class="page" id="page-create-post"></section>
    <section class="page" id="page-search"></section>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home"><span class="ni"><i class="ri-home-9-line"></i></span><span>首页</span></div>
    <div class="nav-item" data-tab="shop"><span class="ni"><i class="ri-shopping-bag-4-line"></i></span><span>售卖</span></div>
    <div class="nav-item" data-tab="msg"><span class="ni"><i class="ri-message-3-line"></i></span><span>信息</span></div>
    <div class="nav-item" data-tab="mine"><span class="ni"><i class="ri-user-line"></i></span><span>我的</span></div>
  </nav>

</div>

<!-- ====== 弹层：鸟种详情 ====== -->
<div class="modal" id="modalBird">
  <div class="modal-head"><span id="birdModalTitle">鸟种详情</span><span class="close" onclick="closeModal('modalBird')">✕</span></div>
  <div class="modal-body" id="birdModalBody"></div>
</div>

<!-- ====== 弹层：观测点详情 ====== -->
<div class="modal" id="modalSpot">
  <div class="modal-head"><span id="spotModalTitle">观测点</span><span class="close" onclick="closeModal('modalSpot')">✕</span></div>
  <div class="modal-body" id="spotModalBody"></div>
</div>

<!-- ====== 弹层：VIP ====== -->
<div class="modal" id="modalVip">
  <div class="modal-head"><span>Feather Trace VIP</span><span class="close" onclick="closeModal('modalVip')">✕</span></div>
  <div class="modal-body" id="vipBody"></div>
</div>

<!-- 轻提示 -->
<div id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="map.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
