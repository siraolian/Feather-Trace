<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2E7D32">
<title>羽迹 · 观鸟交流平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime">08:33</span>
    <span class="sb-right">5G&nbsp;🔋48%</span>
  </div>

  <!-- 顶部主功能 Tab：交流 / 地图 / AI识别 / 进度 -->
  <div class="top-tabs">
    <div class="tab" data-tab="comm">交流</div>
    <div class="tab" data-tab="map">地图</div>
    <div class="tab" data-tab="ai">AI识别</div>
    <div class="tab" data-tab="progress">进度</div>
  </div>

  <!-- 主内容区 -->
  <main class="main" id="main">
    <section class="page" id="page-comm"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-ai"></section>
    <section class="page" id="page-progress"></section>
  </main>

  <!-- 底部导航：首页 / 售卖 / 信息 / 我的 -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home"><span class="ni">🏠</span><span>首页</span></div>
    <div class="nav-item" data-tab="shop"><span class="ni">🛒</span><span>售卖</span></div>
    <div class="nav-item" data-tab="msg"><span class="ni">💬</span><span>信息</span></div>
    <div class="nav-item" data-tab="mine"><span class="ni">👤</span><span>我的</span></div>
  </nav>

</div>

<!-- ====== 弹层：发帖 ====== -->
<div class="modal" id="modalPost">
  <div class="modal-head">
    <span>发布帖子</span>
    <span class="close" data-close="modalPost">✕</span>
  </div>
  <div class="modal-body">
    <div class="post-type-row" id="postTypeRow">
      <span class="pt active" data-pt="share">分享</span>
      <span class="pt" data-pt="guide">攻略</span>
      <span class="pt" data-pt="qa">问答</span>
      <span class="pt" data-pt="region">地区</span>
    </div>
    <input class="inp" id="postTitle" placeholder="标题（一句话说清）">
    <textarea class="inp ta" id="postContent" placeholder="正文：写下你的观鸟经历、经验或问题…"></textarea>
    <div class="img-row">
      <label class="img-add" for="postImgInput">＋<small>添加图片</small></label>
      <div class="img-preview" id="postImgPreview"></div>
      <input type="file" id="postImgInput" accept="image/*" hidden>
    </div>
    <button class="btn primary" id="postSubmit">发布</button>
  </div>
</div>

<!-- ====== 弹层：鸟种详情 ====== -->
<div class="modal" id="modalBird">
  <div class="modal-head"><span id="birdModalTitle">鸟种详情</span><span class="close" data-close="modalBird">✕</span></div>
  <div class="modal-body" id="birdModalBody"></div>
</div>

<!-- ====== 弹层：观测点详情 ====== -->
<div class="modal" id="modalSpot">
  <div class="modal-head"><span id="spotModalTitle">观测点</span><span class="close" data-close="modalSpot">✕</span></div>
  <div class="modal-body" id="spotModalBody"></div>
</div>

<!-- ====== 弹层：VIP ====== -->
<div class="modal" id="modalVip">
  <div class="modal-head"><span>Feather Trace VIP</span><span class="close" data-close="modalVip">✕</span></div>
  <div class="modal-body" id="vipBody"></div>
</div>

<!-- 轻提示 -->
<div id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="map.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
