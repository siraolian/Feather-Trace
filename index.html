<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2E7D32">
<title>羽迹 · 观鸟交流平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime">08:33</span>
    <span class="sb-right"></span>
  </div>

  <!-- 顶部主功能 Tab -->
  <div class="top-tabs-wrapper" style="display: flex; align-items: center; background: #95BD39; padding-right: 15px;">
    <div class="top-tabs" style="flex:1; background: transparent;">
      <div class="tab" data-tab="comm">交流</div>
      <div class="tab" data-tab="map">地图</div>
      <div class="tab" data-tab="ai">AI识别</div>
      <div class="tab" data-tab="progress">进度</div>
    </div>
    <!-- 搜索图标按钮 -->
    <span class="icon-search" id="topSearchBtn" style="color: white; font-size: 20px; cursor: pointer; margin-left: 8px;">🔍</span>
  </div>

  <!-- 全屏搜索弹窗 -->
  <div class="modal" id="modalSearch" style="align-items: flex-start; padding-top: 80px;">
    <div class="modal-inner" style="width: 90%; max-width: 360px; border-radius: 18px;">
      <div class="modal-head">
        <span>搜索</span>
        <span class="close" data-close="modalSearch">✕</span>
      </div>
      <div class="modal-body" style="padding: 15px;">
        <!-- 地点输入框 -->
        <input type="text" id="globalLocationInput" class="inp" style="margin: 0 0 10px 0; font-size: 14px;" placeholder="输入地点（如：沙湖）定位10公里">
        
        <!-- 关键词输入框 -->
        <input type="text" id="globalSearchInput" class="inp" style="margin: 0; font-size: 16px;" placeholder="搜索鸟种、帖子...">
        
        <!-- 搜索结果区 -->
        <div id="searchResults" style="margin-top: 15px; min-height: 100px;">
          <div class="empty" style="padding: 20px;"><div class="e">🔍</div>输入关键词开始搜索</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 主内容区 -->
  <main class="main" id="main">
    <section class="page" id="page-comm"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-ai"></section>
    <section class="page" id="page-progress"></section>
    <!-- 独立子页面 -->
    <section class="page" id="page-my-birds"></section>
    <section class="page" id="page-my-badges"></section>
    <section class="page" id="page-offline"></section>
    <section class="page" id="page-edit-profile"></section>
    <section class="page" id="page-user-profile"></section>
  </main>

  <!-- 底部导航：首页 / 售卖 / 信息 / 我的 -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home"><span class="ni">🏠</span><span>首页</span></div>
    <div class="nav-item" data-tab="shop"><span class="ni">🛒</span><span>售卖</span></div>
    <div class="nav-item" data-tab="msg"><span class="ni">💬</span><span>信息</span></div>
    <div class="nav-item" data-tab="mine"><span class="ni">👤</span><span>我的</span></div>
  </nav>

</div>

<!-- ====== 弹层：发帖 ====== -->
<div class="modal" id="modalPost">
  <div class="modal-head">
    <span>发布帖子</span>
    <span class="close" data-close="modalPost">✕</span>
  </div>
  <div class="modal-body">
    <div class="post-type-row" id="postTypeRow">
      <span class="pt active" data-pt="share">分享</span>
      <span class="pt" data-pt="guide">攻略</span>
      <span class="pt" data-pt="qa">问答</span>
      <span class="pt" data-pt="region">地区</span>
    </div>
    <input class="inp" id="postTitle" placeholder="标题（一句话说清）">
    <textarea class="inp ta" id="postContent" placeholder="正文：写下你的观鸟经历、经验或问题…"></textarea>
    <div class="img-row">
      <label class="img-add" for="postImgInput">＋<small>添加图片</small></label>
      <div class="img-preview" id="postImgPreview"></div>
      <input type="file" id="postImgInput" accept="image/*" hidden>
    </div>
    <button class="btn primary" id="postSubmit">发布</button>
  </div>
</div>

<!-- ====== 弹层：鸟种详情 ====== -->
<div class="modal" id="modalBird">
  <div class="modal-head"><span id="birdModalTitle">鸟种详情</span><span class="close" data-close="modalBird">✕</span></div>
  <div class="modal-body" id="birdModalBody"></div>
</div>

<!-- ====== 弹层：观测点详情 ====== -->
<div class="modal" id="modalSpot">
  <div class="modal-head"><span id="spotModalTitle">观测点</span><span class="close" data-close="modalSpot">✕</span></div>
  <div class="modal-body" id="spotModalBody"></div>
</div>

<!-- ====== 弹层：VIP ====== -->
<div class="modal" id="modalVip">
  <div class="modal-head"><span>Feather Trace VIP</span><span class="close" data-close="modalVip">✕</span></div>
  <div class="modal-body" id="vipBody"></div>
</div>

<!-- 轻提示 -->
<div id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="map.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
