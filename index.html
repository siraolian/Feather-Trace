<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2E7D32">
<title>羽迹 · 观鸟交流平台</title>
<link href="https://cdn.staticfile.net/remixicon/3.5.0/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="phone">

  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime">08:33</span>
    <span class="sb-right"></span>
  </div>

  <!-- 顶部主功能 Tab -->
  <div class="top-tabs-wrapper" style="display: flex; align-items: center; background: #95BD39; padding-right: 15px;">
    <div class="top-tabs" style="flex:1; background: transparent;">
      <div class="tab" data-tab="comm">交流</div>
      <div class="tab" data-tab="map">地图</div>
      <div class="tab" data-tab="ai">AI识别</div>
      <div class="tab" data-tab="progress">进度</div>
    </div>
    <!-- 搜索图标按钮 -->
    <span class="icon-search" id="topSearchBtn" style="color: white; font-size: 20px; cursor: pointer; margin-left: 8px;"><i class="ri-search-line"></i></span>
  </div>

  <!-- 全屏搜索弹窗 -->
  <div class="modal" id="modalSearch" style="align-items: flex-start; padding-top: 80px;">
    <div class="modal-inner" style="width: 90%; max-width: 360px; border-radius: 18px;">
      <div class="modal-head">
        <span>搜索</span>
        <span class="close" data-close="modalSearch">✕</span>
      </div>
      <div class="modal-body" style="padding: 15px;">
        <!-- 地点输入框 -->
        <input type="text" id="globalLocationInput" class="inp" style="margin: 0 0 10px 0; font-size: 14px;" placeholder="输入地点（如：沙湖）定位10公里">
        
        <!-- 关键词输入框 -->
        <input type="text" id="globalSearchInput" class="inp" style="margin: 0; font-size: 16px;" placeholder="搜索鸟种、帖子...">
        
        <!-- 搜索结果区 -->
        <div id="searchResults" style="margin-top: 15px; min-height: 100px;">
          <div class="empty" style="padding: 20px;"><div class="e"><i class="ri-search-line"></i></div>输入关键词开始搜索</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 主内容区 -->
  <main class="main" id="main">
    <section class="page" id="page-comm"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-ai"></section>
    <section class="page" id="page-progress"></section>
    <!-- 独立子页面 -->
    <section class="page" id="page-my-birds"></section>
    <section class="page" id="page-my-badges"></section>
    <section class="page" id="page-offline"></section>
    <section class="page" id="page-edit-profile"></section>
    <section class="page" id="page-user-profile"></section>
    <section class="page" id="page-create-post"></section>
    <section class="page" id="page-search"></section>
    <section class="page" id="page-settings"></section>
    <section class="page" id="page-history"></section>
    <section class="page" id="page-favorites"></section>
    <section class="page" id="page-follow-list"></section>
    <section class="page" id="page-fans-list"></section>
    <section class="page" id="page-post-detail"></section>
    <section class="page" id="page-chat-detail"></section>
  </main>

  <!-- 底部导航：首页 / 售卖 / 信息 / 我的 -->
   <!-- 底部导航 -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      <span>首页</span>
    </div>
    
    <div class="nav-item" data-tab="shop">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
      </span>
      <span>售卖</span>
    </div>
    
    <div class="nav-item" data-tab="msg">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </span>
      <span>信息</span>
    </div>
    
    <div class="nav-item" data-tab="mine">
      <span class="ni">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </span>
      <span>我的</span>
    </div>
  </nav>

</div>

<!-- ====== 弹层：鸟种详情 ====== -->
<div class="modal" id="modalBird">
  <div class="modal-inner">
  <div class="modal-head"><span id="birdModalTitle">鸟种详情</span><span class="close" data-close="modalBird">✕</span></div>
  <div class="modal-body" id="birdModalBody"></div>
</div>
</div>

<!-- ====== 弹层：观测点详情 ====== -->
<div class="modal" id="modalSpot">
  <div class="modal-inner">
  <div class="modal-head"><span id="spotModalTitle">观测点</span><span class="close" data-close="modalSpot">✕</span></div>
  <div class="modal-body" id="spotModalBody"></div>
</div>
</div>
  
<!-- ====== 弹层：VIP ====== -->
<div class="modal" id="modalVip">
  <div class="modal-inner">
  <div class="modal-head"><span>Feather Trace VIP</span><span class="close" data-close="modalVip">✕</span></div>
  <div class="modal-body" id="vipBody"></div>
</div>
</div>

<!-- ====== 弹层：评论输入框 ====== -->
<div class="comment-modal" id="commentModal">
  <div class="comment-overlay" onclick="App.closeCommentModal()"></div>
  <div class="comment-input-area">
    <input type="text" id="commentInput" placeholder="说点什么吧..." autocomplete="off">
    <button class="btn primary" id="commentSendBtn" onclick="App.submitComment()">发送</button>
  </div>
</div>

<!-- ====== 弹层：上传新鸟种 ====== -->
<div class="modal" id="modalUploadBird">
  <div class="modal-inner">
    <div class="modal-head">
      <span>上传新鸟种</span>
      <span class="close" data-close="modalUploadBird">✕</span>
    </div>
    <div class="modal-body">
      <div style="text-align:center; margin-bottom:15px;">
        <img id="uploadBirdImgPreview" src="" style="width:100%; max-height:200px; border-radius:12px; object-fit:cover; display:none; margin-bottom:10px;">
        <label for="uploadBirdImgInput" class="btn ghost block" style="border:1px dashed var(--green); cursor:pointer;">📷 点击上传照片</label>
        <input type="file" id="uploadBirdImgInput" accept="image/*" style="display:none;">
      </div>
      <input class="inp" id="uploadBirdName" placeholder="鸟类名称（如：红嘴蓝鹊）">
      <input class="inp" id="uploadBirdLoc" placeholder="发现地点（如：沙湖公园）">
      <textarea class="inp ta" id="uploadBirdDesc" placeholder="其他特征描述（选填）" style="min-height:70px;"></textarea>
      <button class="btn primary block" onclick="App.submitUploadBird()">保存收录</button>
    </div>
  </div>
</div>

<!-- ====== 弹层：回复评论 ====== -->
<div class="comment-modal" id="replyModal">
  <div class="comment-overlay" onclick="App.closeReplyModal()"></div>
  <div class="comment-input-area">
    <input type="text" id="replyInput" placeholder="回复评论..." autocomplete="off">
    <button class="btn primary" onclick="App.submitReply()">发送</button>
  </div>
</div>
  
<!-- 轻提示 -->
<div id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="map.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
